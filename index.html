<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CALCULATOR</title>
    <link rel="stylesheet" href="st.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <h1 class="Ordinary">Scientific
        Calculator</h1>
    <div class="cal">
        <div class="display">
            <input type="text" name="display" id="screen" value="0" readonly>
        </div>
        <div>
            <button>2NDF</button>
            <button>DRG</button>
            <span class="blank"></span><button>OFF</button><button>ON/C</button>
        </div>
        <div>
            <button class="btn">
                <span class="sec">arc hyp</span>
                <span>hyp</span>
            </button>
            <button class="btn">
                <span class="sec">sin⁻¹</span>
                <span>sin</span>
            </button>
            <button class="btn">
                <span class="sec">cos⁻¹</span>
                <span>cos</span>
            </button>
            <button class="btn">
                <span class="sec">tan⁻¹</span>
                <span>tan</span>
            </button>
            <button class="btn">
                <span class="sec">TAB</span>
                <span>F->E</span>
            </button>
            <button class="btn">
                <span class="sec">n!</span>
                <span>CE</span>
            </button>
        </div>
        <div>
            <button class="btn">
                <span class="sec">DMS</span>
                <span>->DEG</span>
            </button>
            <button class="btn">
                <span class="sec"><sub>e</sub>x</span>
                <span>ln</span>
            </button>
            <button class="btn">
                <span class="sec"><sub>10</sub>X</span>
                <span>log</span>
            </button>
            <button class="btn">
                <span class="sec">R->P</span>
                <span>a</span>
            </button>
            <button class="btn">
                <span class="sec">P->R</span>
                <span>b</span>
            </button>
            <button class="btn">
                <span class="sec">CPLX</span>
                <span>---></span>
            </button>
        </div>
        <div>
            <button class="btn">
                <span class="sec">π</span>
                <span>EXP</span>
            </button>
            <button class="btn">
                <span class="sec">x<sub>&radic;y</sub></span>
                <span><sub>y</sub>x</span>
            </button>
            <button class="btn">
                <span class="sec">3<sub>&radic;</sub></span>
                <span>&radic;</span>
            </button>
            <button class="btn">
                <span class="sec">1/x</span>
                <span><sub>X</sub>2</span>
            </button>
            <button class="sym">(</button>
            <button class="sym">)</button>
        </div>
        <div>
            <button class="sym">7</button><button class="sym col2">8</button><button class="sym col3">9</button><span class="space"></span><button
                class="sym">/</button><button>X->M</button>
        </div>
        <div>
            <button class="sym">4</button><button class="sym col2">5</button><button class="sym col3">6</button><span class="space"></span><button
                class="sym">x</button><button>RM</button>
        </div>
        <div>
            <button class="sym">1</button><button class="sym col2">2</button><button class="sym col3">3</button><span class="space"></span><button
                class="sym">-</button><button>M+</button>
        </div>
        <div>
            <button class="sym">0</button><button class="sym col2">+/-</button><button class="sym col3">.</button><span class="space"></span><button
                class="sym">+</button><button class="sym">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
